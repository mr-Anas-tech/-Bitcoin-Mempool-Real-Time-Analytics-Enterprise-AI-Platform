version: 2

models:
  - name: int_mempool
    description: "Intermediate model calculating fee spreads, congestion flags, and block metrics"
    columns:
      - name: mempool_id
        tests:
          - unique
          - not_null

      - name: network_congestion_status
        tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['High Congestion', 'Moderate Congestion', 'Low Congestion']

      - name: avg_fee_per_tx
        tests:
          - not_null